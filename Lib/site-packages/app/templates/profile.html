<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <center><a class="nav-link" href="{{ url_for('my_groups') }}">Return to My Groups</a></center>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h2 class="mt-4">My Profile</h2>
        <form method="POST" action="{{ url_for('update_profile') }}">
            <div class="form-group">
                <label>Username:</label>
                <input type="text" class="form-control" name="username" value="{{ current_user.username }}" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" class="form-control" name="email" value="{{ current_user.email }}" required>
            </div>
            <div class="form-group">
                <label>Phone:</label>
                <input type="text" class="form-control" name="phone" value="{{ current_user.phone }}">
            </div>
            <button type="submit" class="btn btn-primary">Update Profile</button>
        </form>
    </div>
</body>
</html>
